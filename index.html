function downloadJson(data,name) {
 const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
 const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function clearFilters() { state.statusFilter='Tous';state.priorityFilter='';state.dateFilter='';state.dateFrom='';state.dateTo=''; }
function renderToday() {
 const today=todayIso(), rows=getVisibleProspects().filter(activeProspect);
 const sections=[['Relances du jour',rows.filter(p=>nextReminderDate(p)===today)],['Appels et rendez-vous du jour',rows.filter(p=>p.next_meeting===today)],['Éléments en retard',rows.filter(overdueProspect)]];
 return `<section class="panel today-panel"><div class="section-heading"><div><h2>Aujourd’hui</h2><p class="muted">Vos actions prévues et celles à rattraper.</p></div><button class="btn" data-action="toggle-filter">Filtres</button></div>${state.filterOpen?renderFilters():''}<div class="today-grid">${sections.map(([title,items])=>`<section><h3>${title} <span class="result-pill">${items.length}</span></h3>${items.map(p=>`<button class="today-card${overdueProspect(p)?' is-overdue':''}" data-action="calendar-open-prospect" data-id="${attr(p.id)}"><strong>${esc(p.company)}</strong><span>${esc(p.contact_name||'Contact à compléter')}</span><span>${priorityBadge(p)} · ${esc(statusLabel(p.status))}</span><small>Relance : ${formatDateFr(nextReminderDate(p))} · RDV : ${formatDateFr(p.next_meeting)}</small></button>`).join('')||'<p class="empty-table">Aucune action.</p>'}</section>`).join('')}</div></section>`;
}
function renderMetrics() {
 const active=state.prospects.filter(activeProspect), won=state.prospects.filter(p=>p.status==='Gagné').length,closed=state.prospects.filter(p=>['Gagné','Perdu'].includes(p.status)).length;
 const month=todayIso().slice(0,7), added=state.prospects.filter(p=>String(p.created_at||'').startsWith(month)).length;
 return `<section class="useful-metrics">${[[active.filter(overdueProspect).length,'Prospects en retard','overdue'],[active.filter(p=>p.next_meeting===todayIso()).length,'Appels / RDV aujourd’hui','today'],[active.filter(p=>!nextReminderDate(p)&&!p.next_meeting).length,'Sans prochaine action','none']].map(([n,l,f])=>`<button class="mini-card" data-action="metric-filter" data-date="${f}"><span>${l}</span><strong>${n}</strong></button>`).join('')}<div class="mini-card"><span>Gagnés / dossiers clôturés</span><strong>${closed?Math.round(100*won/closed)+' %':'—'}</strong><small>${won} gagnés sur ${closed} clôturés</small></div><div class="mini-card"><span>Créés ce mois</span><strong>${added}</strong><small>D’après les dates de création enregistrées</small></div></section>`;
}
function renderMembersCard() {
  if (!can('members')) return ''
  return `<section class="panel settings-card data-settings"><h2>Membres de l’équipe</h2><p class="muted">Invitez vos collaborateurs. Une désactivation coupe les nouvelles requêtes immédiatement et ferme leur écran au prochain contrôle, sous quelques secondes.</p><form class="form-grid" data-form="invite-member"><label class="field"><span>Nom professionnel</span><input class="text-input" name="invite_display_name" maxlength="120" required /></label><label class="field"><span>Email professionnel</span><input class="text-input" name="invite_email" type="email" maxlength="254" required /></label><div class="span-2"><button class="btn btn-dark" type="submit">Inviter comme collaborateur</button></div></form><div class="activity-history">${state.members.map(m=>`<article><div class="history-heading"><strong>${esc(m.display_name||m.email||'Membre')}</strong><span class="priority-badge">${esc(m.role==='admin'?'Administrateur':'Collaborateur')}</span></div><p>${esc(m.email||'')} · ${esc(m.state==='active'?'Actif':'Désactivé')}</p>${m.user_id===state.session?.user?.id?'':`<div class="settings-actions"><button class="btn" data-action="manage-member" data-id="${attr(m.id)}" data-member-action="${m.state==='active'?'disable':'enable'}">${m.state==='active'?'Désactiver':'Réactiver'}</button><button class="btn" data-action="manage-member" data-id="${attr(m.id)}" data-member-action="set-role" data-member-role="${m.role==='admin'?'collaborator':'admin'}">${m.role==='admin'?'Passer collaborateur':'Passer administrateur'}</button></div>`}</article>`).join('')}</div></section>`
}
function renderSettings() {
  const sharedSettings = can('settings')
    ? `<form data-form="status-labels">${STATUSES.map(s=>`<label class="field status-name"><span>${esc(s)}</span><input class="text-input" name="${attr(s)}" value="${attr(statusLabel(s))}" maxlength="40" required /></label>`).join('')}<button class="btn btn-dark" type="submit">Enregistrer les noms</button></form>`
    : `<p class="muted">Les noms et couleurs partagés sont gérés par un administrateur.</p>`
  const remoteRestore = state.backend==='supabase' && can('restore')
    ? '<label class="btn">Restaurer une sauvegarde<input type="file" accept=".json,application/json" data-import hidden /></label>' : ''
  const localTools = state.backend==='demo'
    ? '<label class="btn">Importer une sauvegarde<input type="file" accept=".json,application/json" data-import hidden /></label><button class="btn" data-action="restore-previous">Annuler la dernière restauration</button><button class="btn btn-danger" data-action="clear-data">Effacer les données locales</button>' : remoteRestore
  return `<div class="settings-grid"><section class="panel settings-card"><h2>Apparence</h2><p class="muted">Thème personnel, couleurs de l’interface et codes HEX.</p><button class="btn btn-dark" data-action="open-colors">Personnaliser l’apparence</button><h3>Colonnes du pipeline</h3><p class="muted">Afficher, masquer et déplacer les colonnes.</p>${PIPELINE_PREFS.order.map((s,i)=>`<div class="pipeline-setting"><label><input type="checkbox" data-column="${attr(s)}"${checked(!PIPELINE_PREFS.hidden.includes(s))}/> ${esc(statusLabel(s))}</label><button class="btn" data-action="column-move" data-status="${attr(s)}" data-delta="-1"${i===0?' disabled':''}>←</button><button class="btn" data-action="column-move" data-status="${attr(s)}" data-delta="1"${i===PIPELINE_PREFS.order.length-1?' disabled':''}>→</button></div>`).join('')}</section>
  <section class="panel settings-card"><h2>Statuts</h2><p class="muted">Les libellés partagés restent liés aux étapes métier.</p>${sharedSettings}</section>
  <section class="panel settings-card data-settings"><h2>Données et sauvegardes</h2><p>${state.prospects.length} prospects.</p><p class="muted">L’export contient les prospects et leur historique. La restauration remplace toutes les données partagées dans une seule opération et conserve d’abord une copie locale.</p><div class="settings-actions"><button class="btn btn-dark" data-action="export-json">Exporter JSON</button>${localTools}</div><p class="muted">Conservez les fichiers JSON dans un endroit privé, en dehors de GitHub.</p></section>${renderMembersCard()}</div>`
}

app.addEventListener('input',event=>{
 const input=event.target.closest('[data-search]'); if(!input)return;
 state.query=input.value;
 // Afficher les résultats globaux dans la liste, y compris depuis les paramètres ou l’agenda.
 if(!['dashboard','pipeline','reminders','today'].includes(state.view)) state.view='dashboard';
 rerenderAndRefocus(input.dataset.search,input.selectionStart);
});
app.addEventListener('change',async event=>{
 const input=event.target;
 try {
  if(input.dataset.change==='status-filter') {state.statusFilter=input.value;render();}
  else if(input.dataset.change==='quick-status') {await updateProspect(input.dataset.id,{status:input.value});await loadTimeline(input.dataset.id);render();}
  else if(input.dataset.advanced) {state[input.dataset.advanced]=input.value;render();}
  else if(input.dataset.pipelineSort) {PIPELINE_PREFS[input.dataset.pipelineSort]=input.value;localStorage.setItem('dovozo-pipeline',JSON.stringify(PIPELINE_PREFS));if(state.backend==='supabase'&&can('settings'))await saveSharedSettings();render();}
  else if(input.dataset.column) {const s=input.dataset.column;PIPELINE_PREFS.hidden=input.checked?PIPELINE_PREFS.hidden.filter(x=>x!==s):[...new Set([...PIPELINE_PREFS.hidden,s])];localStorage.setItem('dovozo-pipeline',JSON.stringify(PIPELINE_PREFS));if(state.backend==='supabase'&&can('settings'))await saveSharedSettings();render();}
  else if(input.hasAttribute('data-import')) {
   const file=input.files[0]; if(!file)return;
   if(file.size>25*1024*1024)throw new Error('Fichier trop volumineux (25 Mo maximum).');
   let raw;try{raw=JSON.parse(await file.text());}catch{throw new Error('Le fichier ne contient pas de JSON valide.');}
   const b=validateBackup(raw);
    if(confirm(`Restaurer ${b.prospects.length} prospects et remplacer les ${state.prospects.length} prospects actuels ? Une copie de l’état actuel sera téléchargée.`)) {
      if(state.backend==='demo') restoreBackup(raw); else await restoreRemoteBackup(raw)
      render();toast('Sauvegarde restaurée.')
    }
   input.value='';
  }
 }catch(error){console.error(error);toast(error.message,true);if(input.hasAttribute('data-import'))input.value='';}
});
app.addEventListener('submit',async event=>{
 const form=event.target;if(form.dataset.form!=='status-labels')return;
 event.preventDefault();const data=new FormData(form),labels={};
 for(const s of STATUSES)labels[s]=String(data.get(s)||'').trim();
 if(Object.values(labels).some(x=>!x||x.length>40)||new Set(Object.values(labels).map(x=>x.toLocaleLowerCase('fr'))).size!==STATUSES.length)return toast('Choisissez des noms distincts, de 1 à 40 caractères.',true);
  try{
    if(state.backend==='supabase') {
      requirePermission('settings')
      STATUS_LABELS=labels
      await saveSharedSettings()
    }
    localStorage.setItem('dovozo-status-labels',JSON.stringify(labels));STATUS_LABELS=labels;render();toast('Noms des statuts enregistrés.')
  }catch(error){console.error(error);toast('Impossible d’enregistrer les paramètres.',true);}
});
app.addEventListener('click',async event=>{
 const node=event.target.closest('[data-action]');if(!node)return;
 try {
  const a=node.dataset.action;
  if(a==='clear-filters'){clearFilters();render();}
  else if(a==='metric-filter'){clearFilters();state.dateFilter=node.dataset.date;state.view='dashboard';state.filterOpen=true;render();}
  else if(a==='export-json') {
    requirePermission('export')
    downloadJson(state.backend==='demo'?snapshot():await snapshotRemote(),`dovozo-clients-${todayIso()}.json`);toast('Sauvegarde exportée.');
  }
  else if(a==='manage-member') {await manageMember(node.dataset.id,node.dataset.memberAction,node.dataset.memberRole);render();toast('Accès du membre mis à jour.');}
  else if(a==='column-move'){const i=PIPELINE_PREFS.order.indexOf(node.dataset.status),j=i+Number(node.dataset.delta);if(j>=0&&j<STATUSES.length){[PIPELINE_PREFS.order[i],PIPELINE_PREFS.order[j]]=[PIPELINE_PREFS.order[j],PIPELINE_PREFS.order[i]];localStorage.setItem('dovozo-pipeline',JSON.stringify(PIPELINE_PREFS));if(state.backend==='supabase'&&can('settings'))await saveSharedSettings();render();}}
  else if(a==='restore-previous'){const b=readLocal('dovozo-before-restore',null);if(!b)throw new Error('Aucune restauration précédente.');validateBackup(b);if(confirm('Revenir aux données précédant la dernière restauration ?')){restoreBackup(b);render();toast('Données précédentes restaurées.');}}
  else if(a==='clear-data'){if(state.backend==='demo'&&confirm('Effacer tous les prospects et leur historique local ? Exportez vos données avant de continuer.')){writeLocalTransaction({'dovozo-before-restore':snapshot(),'crm-prospection-demo-v2':[],'dovozo-activities':[],'dovozo-history':[]});state.prospects=[];state.demoActivities=[];state.demoHistory=[];state.selectedId=null;render();toast('Données locales effacées.');}}
  else if(a==='copy-email'){const p=getSelected();if(!p?.email)return;await navigator.clipboard.writeText(p.email);toast('Email copié.');}
  else if(a==='mark-contacted'){const p=getSelected();if(!p)return;await updateProspect(p.id,{contact_date:todayIso(),...(['Identifié','À recontacter'].includes(p.status)?{status:'Contacté'}:{})},{silent:true});await addActivity(p.id,'Contact','Contact effectué');render();toast('Contact enregistré.');}
  else if(a==='create-reminder'){const input=document.querySelector('#quick-reminder-date');input?.focus();input?.scrollIntoView({block:'center',behavior:'smooth'});input?.showPicker?.();toast('Choisissez la date puis enregistrez la fiche.');}
  else if(a==='meeting-calendar'){const p=getSelected();if(!p?.next_meeting)throw new Error('Renseignez d’abord la date du rendez-vous.');window.open(googleCalendarUrl(p,p.next_meeting,'Rendez-vous'),'_blank','noopener');}
 }catch(error){console.error(error);toast(error.message||'Action impossible.',true);}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){state.editor=null;state.colorSettingsOpen=false;state.userMenuOpen=false;state.searchExpanded=false;render();}});
window.addEventListener('focus', refreshConnectedAccess)
document.addEventListener('visibilitychange', refreshConnectedAccess)
setInterval(refreshConnectedAccess, 5000)

init()

</script>
