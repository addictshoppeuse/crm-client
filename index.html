<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#2D2D2D" />
<meta name="description" content="CRM de prospection client partagé" />
<title>Dovozo clients</title>
<link rel="icon" href="data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%20role%3D%22img%22%20aria-label%3D%22CRM%20Prospection%22%3E%0A%20%20%3Cpath%20d%3D%22M23.6%2028.8C13.8%2027.9%209%2021.4%208.4%2012.2c9.1.4%2015.1%204.9%2015.2%2016.6Z%22%20fill%3D%22#b8cf35%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M25.1%2027.2C25.5%2015.4%2032.8%208.1%2041.7%206.8c.1%2010.6-4.6%2018.1-16.6%2020.4Z%22%20fill%3D%22#fff%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M24.3%2027.2c-.8%205.6-.8%209.7-.3%2014%22%20fill%3D%22none%22%20stroke%3D%22#8b9b2d%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%2F%3E%0A%3C%2Fsvg%3E%0A" type="image/svg+xml" />
<style>
:root {
  --excel-dark: #2D2D2D;
  --page-bg: #f7f8fa;
  --card: #ffffff;
  --text: #171a21;
  --muted: #657083;
  --line: #e3e6eb;
  --line-dark: #d5d9e0;
  --selected: #f7f0fb;
  --shadow: 0 1px 3px rgba(20, 26, 38, .04), 0 8px 30px rgba(20, 26, 38, .035);
  --radius: 12px;
  --danger: #9a2525;
  --focus: #6d4fa3;
  --topbar-bg: #2d2d2d;
  --topbar-text: #ffffff;
  --button-bg: #2d2d2d;
  --button-text: #ffffff;
  --kpi-bg: #ffffff;
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--page-bg); }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--page-bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
a { color: #20569a; }
svg { display: block; }

*:focus-visible {
  outline: 3px solid rgba(109, 79, 163, .2);
  outline-offset: 2px;
}

.boot-screen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 14px;
  color: var(--muted);
}
.boot-spinner {
  width: 26px; height: 26px;
  border: 3px solid #e6e8ec;
  border-top-color: #4a235a;
  border-radius: 50%;
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Auth */
.auth-page {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 520px);
  background: #f8f8f9;
}
.auth-visual {
  background: linear-gradient(145deg, #242424, #343434);
  color: white;
  padding: clamp(36px, 6vw, 90px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 100vh;
}
.auth-brand { display:flex; align-items:center; gap:12px; font-size:24px; font-weight:750; }
.auth-brand img { width: 42px; height: 42px; }
.auth-copy { max-width: 620px; padding: 80px 0; }
.auth-copy h1 { margin:0 0 18px; font-size: clamp(38px, 5vw, 64px); line-height:1.02; letter-spacing:-.045em; }
.auth-copy p { margin:0; color:#d5d5d5; font-size:18px; line-height:1.6; max-width:540px; }
.auth-palette { display:grid; grid-template-columns:repeat(8,1fr); gap:6px; max-width:520px; }
.auth-palette span { height:8px; border-radius:999px; }
.auth-card-wrap { display:grid; place-items:center; padding:36px; }
.auth-card { width:min(390px,100%); }
.auth-card h2 { margin:0 0 8px; font-size:28px; letter-spacing:-.025em; }
.auth-card > p { margin:0 0 26px; color:var(--muted); }
.auth-form { display:grid; gap:16px; }
.field { display:grid; gap:7px; }
.field span, .field-label { font-size:12px; font-weight:700; color:#4d5665; }
.text-input, .select-input, .textarea-input {
  width:100%;
  border:1px solid var(--line-dark);
  background:#fff;
  color:var(--text);
  border-radius:9px;
  padding:11px 12px;
  min-height:42px;
}
.textarea-input { min-height:98px; resize:vertical; line-height:1.45; }
.auth-message { border-radius:8px; padding:10px 12px; background:#fff4e1; border:1px solid #f6ddaf; color:#704613; font-size:13px; }
.auth-brand img { border-radius:10px; background:#fff; padding:3px; box-sizing:border-box; }
.auth-brand-copy { display:grid; line-height:1.1; }
.auth-brand-title { color:#fff; font-size:20px; font-weight:800; letter-spacing:-.03em; }
.auth-brand-sub { font-size:12px; font-weight:500; color:#b9b9b9; }
.auth-divider { display:flex; align-items:center; gap:12px; margin:28px 0 14px; color:var(--muted); font-size:13px; font-weight:600; }
.auth-divider::before, .auth-divider::after { content:""; flex:1; height:1px; background:var(--line-dark); }
.auth-form-secondary { gap:12px; }
.auth-form-secondary .btn { justify-content:center; }
.auth-switch { margin-top:16px; border:0; background:transparent; color:#4a235a; padding:4px 0; font-weight:700; }

/* Shared buttons */
.btn {
  border:1px solid var(--line-dark);
  border-radius:8px;
  min-height:40px;
  padding:9px 14px;
  background:#fff;
  color:var(--text);
  font-weight:650;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  white-space:nowrap;
}
.btn:hover { background:#f7f7f8; }
.btn-dark { background:#2d2d2d; color:#fff; border-color:#2d2d2d; }
.btn-dark:hover { background:#1f1f1f; }
.btn-purple { background:#4a235a; color:#fff; border-color:#4a235a; }
.btn-purple:hover { background:#3f1d4d; }
.btn-danger { color:#8b2020; border-color:#eed0d0; background:#fff8f8; }
.btn-icon { width:40px; padding:0; }
.btn-ghost { background:transparent; border-color:transparent; }
.btn[disabled] { opacity:.55; cursor:not-allowed; }
.icon { width:18px; height:18px; flex:0 0 auto; }

/* Main app */
.app-topbar {
  height:64px;
  background: linear-gradient(180deg, #303030, #292929);
  color:#fff;
  display:flex;
  align-items:center;
  gap:26px;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:30;
  box-shadow:0 1px 0 rgba(255,255,255,.05);
}
.top-brand { display:flex; align-items:center; gap:10px; font-size:23px; font-weight:760; letter-spacing:-.025em; white-space:nowrap; }
.top-brand img { width:34px; height:34px; object-fit:contain; border-radius:7px; flex:0 0 auto; }
.top-nav { display:flex; align-items:stretch; gap:4px; height:100%; }
.nav-btn {
  color:#f2f2f2;
  border:0;
  background:transparent;
  padding:0 16px;
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:600;
  position:relative;
}
.nav-btn:hover { background:rgba(255,255,255,.06); }
.nav-btn.active { background:rgba(255,255,255,.11); }
.nav-btn.active::after { content:""; position:absolute; left:13px; right:13px; bottom:0; height:3px; background:#fff; border-radius:3px 3px 0 0; }
.nav-count { min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:#f3e5f5; color:#4a235a; display:grid; place-items:center; font-size:11px; font-weight:800; }
.top-spacer { flex:1; }
.top-search-wrap { position:relative; width:min(310px,25vw); }
.top-search-wrap .icon { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:#cfd2d7; pointer-events:none; }
.top-search {
  width:100%;
  background:#343434;
  color:#fff;
  border:1px solid #5a5a5a;
  border-radius:8px;
  padding:9px 12px 9px 36px;
  min-height:38px;
}
.top-search::placeholder { color:#c2c3c6; }
.user-menu { position:relative; }
.user-button { border:0; background:transparent; color:#fff; display:flex; align-items:center; gap:10px; padding:5px 0; }
.avatar { width:36px; height:36px; border-radius:50%; background:#c7b4d0; color:#fff; display:grid; place-items:center; font-weight:700; }
.user-name { max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.user-popover {
  position:absolute; right:0; top:48px; width:220px; background:#fff; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px; box-shadow:0 16px 44px rgba(0,0,0,.16); z-index:50;
}
.user-popover .menu-row { padding:9px 10px; border-radius:7px; font-size:13px; color:var(--muted); overflow-wrap:anywhere; }
.user-popover button { width:100%; text-align:left; border:0; background:transparent; padding:10px; border-radius:7px; font-weight:650; }
.user-popover button:hover { background:#f5f5f6; }
.demo-pill { display:inline-flex; align-items:center; gap:6px; background:#f3e5f5; color:#4a235a; padding:5px 8px; border-radius:999px; font-size:11px; font-weight:800; }

.page { padding:24px 22px 30px; }
.page-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin:0 4px 20px; }
.page-head h1 { margin:0; font-size:31px; line-height:1.1; letter-spacing:-.035em; }
.page-head p { margin:6px 0 0; color:var(--muted); font-size:16px; }
.current-date { color:#515968; padding-top:4px; white-space:nowrap; }

.kpi-scroller { overflow-x:auto; padding:0 4px 6px; margin:0 -4px 16px; scrollbar-width:thin; }
.kpi-grid { display:grid; grid-template-columns:minmax(150px,1.08fr) repeat(8,minmax(135px,1fr)); gap:12px; min-width:1330px; }
.kpi-card {
  min-height:108px;
  border:1px solid var(--line);
  border-radius:10px;
  padding:15px 16px 13px;
  background:#fff;
  display:grid;
  grid-template-columns:1fr auto;
  grid-template-rows:auto 1fr auto;
  box-shadow:var(--shadow);
}
.kpi-label { font-weight:750; font-size:14px; grid-column:1; }
.kpi-icon { grid-column:2; grid-row:1 / span 2; align-self:center; opacity:.9; }
.kpi-number { font-size:30px; font-weight:780; letter-spacing:-.04em; align-self:center; line-height:1; margin-top:5px; }
.kpi-hint { grid-column:1 / -1; color:inherit; opacity:.75; font-size:11px; }
.kpi-card.total { background:#fff; color:#171a21; }
.kpi-card.total .kpi-icon { color:#9ca1aa; }
button.kpi-card { width:100%; text-align:left; font:inherit; cursor:pointer; }
button.kpi-card:hover { transform:translateY(-1px); box-shadow:0 8px 22px rgba(20,26,38,.10); }
button.kpi-card.active-filter { outline:3px solid rgba(45,45,45,.16); outline-offset:1px; }
.color-modal { width:min(620px,100%); }
.color-help { margin:0 0 18px; color:var(--muted); }
.color-grid { display:grid; gap:10px; }
.color-row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; }
.color-row input[type="color"] { width:54px; height:36px; padding:2px; border:1px solid var(--line-dark); border-radius:8px; background:#fff; cursor:pointer; }

.workspace { display:grid; grid-template-columns:minmax(0,2.45fr) minmax(330px,1fr); gap:18px; align-items:start; }
.panel { background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
.list-panel { overflow:hidden; min-width:0; }
.list-toolbar { min-height:68px; display:flex; align-items:center; gap:10px; padding:12px 14px 12px 17px; border-bottom:1px solid var(--line); }
.list-title { display:flex; align-items:center; gap:12px; min-width:max-content; margin-right:auto; }
.list-title h2 { margin:0; font-size:20px; letter-spacing:-.025em; }
.result-pill { background:#f2f3f5; color:#616977; padding:5px 10px; border-radius:999px; font-size:12px; }
.list-search-wrap { position:relative; width:220px; }
.list-search-wrap .icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:#707987; }
.list-search { width:100%; border:1px solid var(--line-dark); border-radius:8px; min-height:40px; padding:9px 10px 9px 34px; background:#fff; }
.filter-wrap { position:relative; }
.filter-popover { position:absolute; top:46px; right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 40px rgba(0,0,0,.14); padding:12px; z-index:20; width:210px; }
.filter-popover label { display:grid; gap:7px; font-size:12px; font-weight:700; color:#56606f; }

.table-scroll { overflow:auto; max-height:590px; }
.prospect-table { width:100%; border-collapse:separate; border-spacing:0; min-width:870px; }
.prospect-table th {
  position:sticky; top:0; z-index:3;
  background:#fbfbfc;
  color:#596272;
  border-bottom:1px solid var(--line);
  border-right:1px solid #f0f1f3;
  padding:12px 11px;
  font-size:12px;
  text-align:left;
  font-weight:750;
  white-space:nowrap;
}
.prospect-table th:last-child, .prospect-table td:last-child { border-right:0; }
.sort-button { border:0; background:transparent; color:inherit; padding:0; display:inline-flex; align-items:center; gap:6px; font-weight:inherit; }
.sort-glyph { color:#88909b; font-size:12px; }
.prospect-table td { border-bottom:1px solid var(--line); border-right:1px solid #f0f1f3; padding:10px 11px; vertical-align:middle; background:#fff; }
.prospect-table tbody tr { cursor:pointer; }
.prospect-table tbody tr:hover td { background:#fafafe; }
.prospect-table tbody tr.selected td { background:var(--selected); }
.checkbox-cell { width:40px; text-align:center; }
.fake-check { width:18px; height:18px; border:1px solid #aeb4bd; border-radius:4px; display:inline-block; background:#fff; }
.company-cell { min-width:140px; font-weight:750; }
.company-lockup { display:flex; align-items:center; gap:9px; }
.company-mark { width:30px; height:30px; border-radius:8px; background:#f4f4f5; color:#4a235a; display:grid; place-items:center; font-size:12px; font-weight:800; flex:0 0 auto; }
.contact-main { display:block; color:#222630; }
.contact-sub { display:block; color:var(--muted); font-size:11px; margin-top:2px; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.status-chip { display:inline-flex; align-items:center; justify-content:center; min-height:30px; border-radius:8px; padding:5px 10px; font-size:12px; font-weight:750; white-space:nowrap; }
.notes-preview { display:block; max-width:190px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row-menu { border:0; background:transparent; width:32px; height:32px; border-radius:6px; display:grid; place-items:center; font-size:18px; }
.row-menu:hover { background:#f2f3f4; }
.empty-table { padding:45px 20px; text-align:center; color:var(--muted); }

.detail-panel { padding:17px 18px 16px; position:sticky; top:82px; min-height:570px; }
.detail-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.detail-head h2 { margin:0; font-size:20px; letter-spacing:-.02em; }
.close-detail { border:0; background:transparent; color:#434b58; font-size:22px; width:34px; height:34px; border-radius:7px; }
.close-detail:hover { background:#f3f4f5; }
.detail-company { display:flex; gap:13px; align-items:flex-start; padding:20px 0 18px; }
.detail-logo { width:64px; height:64px; border-radius:9px; background:#f5f5f4; display:grid; place-items:center; font-size:29px; color:#6d7f21; flex:0 0 auto; }
.detail-company h3 { margin:4px 0 4px; font-size:17px; }
.detail-company p { margin:0; color:var(--muted); font-size:13px; }
.detail-section { border-top:1px solid #eef0f2; padding-top:15px; margin-top:2px; }
.detail-section.no-border { border-top:0; padding-top:0; }
.detail-label { display:flex; align-items:center; gap:8px; font-size:12px; color:#525c6a; margin-bottom:8px; }
.contact-grid { display:grid; grid-template-columns:1fr; gap:8px; }
.contact-name { font-weight:750; font-size:15px; }
.contact-email { color:#255b9e; font-size:12px; overflow-wrap:anywhere; display:flex; align-items:center; gap:6px; width:max-content; max-width:100%; }
.contact-email .icon { width:15px; height:15px; flex:0 0 auto; }
.detail-form { display:grid; gap:13px; }
.status-select-wrap { position:relative; }
.status-select-wrap select { appearance:none; padding-right:38px; font-weight:750; }
.select-chevron { position:absolute; right:13px; top:50%; transform:translateY(-50%); pointer-events:none; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.detail-field { display:grid; gap:6px; }
.detail-field label { font-size:12px; color:#525c6a; }
.detail-field input, .detail-field textarea, .detail-field select { width:100%; border:1px solid var(--line-dark); border-radius:8px; padding:9px 10px; color:var(--text); background:#fff; min-height:40px; }
.detail-field textarea { min-height:100px; resize:vertical; line-height:1.45; }
.detail-actions { display:flex; gap:8px; margin-top:12px; }
.detail-actions .btn:first-child { flex:1; }
.detail-placeholder { min-height:540px; display:grid; place-items:center; text-align:center; color:var(--muted); padding:30px; }
.detail-placeholder-icon { width:68px; height:68px; border-radius:50%; background:#f3e5f5; color:#4a235a; display:grid; place-items:center; margin:0 auto 14px; }
.detail-placeholder h3 { color:var(--text); margin:0 0 6px; }
.detail-placeholder p { max-width:260px; margin:0; line-height:1.5; }

/* Pipeline */
.kanban-panel { padding:16px; overflow:hidden; }
.kanban-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
.kanban-toolbar h2 { margin:0; font-size:20px; }
.kanban-scroll { overflow-x:auto; padding-bottom:6px; }
.kanban { display:grid; grid-template-columns:repeat(8, minmax(230px, 1fr)); gap:12px; min-width:1910px; }
.kanban-column { border:1px solid var(--line); background:#fafbfc; border-radius:10px; padding:10px; min-height:390px; }
.kanban-column-head { border-radius:8px; padding:10px 11px; display:flex; justify-content:space-between; align-items:center; font-weight:750; margin-bottom:9px; }
.kanban-card { width:100%; border:1px solid var(--line); background:#fff; border-radius:9px; padding:11px; text-align:left; margin-bottom:8px; box-shadow:0 2px 8px rgba(30,36,48,.035); }
.kanban-card:hover { border-color:#c9cdd5; }
.kanban-card strong { display:block; margin-bottom:5px; }
.kanban-card span { display:block; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Reminders */
.reminder-summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
.mini-card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:15px; }
.mini-card span { color:var(--muted); font-size:12px; }
.mini-card strong { display:block; font-size:25px; margin-top:4px; }
.overdue { color:#9a2525; font-weight:750; }
.today { color:#4a235a; font-weight:750; }

/* Modal */
.modal-layer { position:fixed; inset:0; z-index:80; background:rgba(22,25,31,.48); padding:24px; display:grid; place-items:center; overflow:auto; }
.modal { width:min(920px,100%); max-height:calc(100vh - 48px); overflow:auto; background:#fff; border-radius:14px; box-shadow:0 30px 90px rgba(0,0,0,.3); }
.modal-head { position:sticky; top:0; background:#fff; z-index:3; display:flex; justify-content:space-between; align-items:flex-start; gap:14px; padding:20px 22px; border-bottom:1px solid var(--line); }
.modal-head h2 { margin:3px 0 0; font-size:22px; }
.eyebrow { color:#4a235a; font-size:11px; text-transform:uppercase; letter-spacing:.09em; font-weight:800; }
.modal-body { padding:20px 22px 24px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.span-2 { grid-column:span 2; }
.modal-footer { display:flex; gap:9px; align-items:center; margin-top:18px; }
.modal-footer .spacer { flex:1; }
.timeline-section { border-top:1px solid var(--line); margin-top:24px; padding-top:18px; }
.timeline-section h3 { margin:0 0 12px; }
.activity-row { display:grid; grid-template-columns:140px 1fr auto; gap:8px; }
.timeline { margin-top:14px; display:grid; }
.timeline-item { display:grid; grid-template-columns:18px 1fr; gap:8px; padding:9px 0; }
.timeline-dot { width:8px; height:8px; border-radius:50%; background:#4a235a; margin:5px; }
.timeline-item strong { display:block; font-size:13px; }
.timeline-item small { color:var(--muted); display:block; margin-top:3px; }
.toast-zone { position:fixed; bottom:20px; right:20px; z-index:120; display:grid; gap:8px; pointer-events:none; }
.toast { background:#2d2d2d; color:#fff; padding:11px 14px; border-radius:9px; box-shadow:0 12px 35px rgba(0,0,0,.2); font-size:13px; max-width:360px; animation:toast-in .2s ease-out; }
.toast.error { background:#8b2020; }
@keyframes toast-in { from { transform:translateY(8px); opacity:0; } }
/* Mobile : la fiche client s'ouvre en panneau plein écran, uniquement après un choix explicite */
@media (max-width: 860px) {
  .detail-panel { display:none; }
  .detail-panel.detail-open {
    display:block;
    position:fixed; inset:0; z-index:60;
    overflow:auto; -webkit-overflow-scrolling:touch;
    border-radius:0; border:0; box-shadow:none;
    padding:0 16px 32px;
    animation:sheet-in .22s ease-out;
  }
  .detail-panel.detail-open .detail-head {
    position:sticky; top:0; z-index:2;
    margin:0 -16px 12px; padding:12px 16px;
    background:var(--card); border-bottom:1px solid var(--line);
  }
  .detail-panel.detail-open .close-detail { width:40px; height:40px; font-size:26px; background:#f3f4f5; }
}
@keyframes sheet-in { from { transform:translateY(24px); opacity:0; } }

@media (max-width: 1180px) {
  .workspace { grid-template-columns:1fr; }
  .detail-panel { position:static; min-height:0; }
  .detail-placeholder { min-height:260px; }
  .top-search-wrap { width:220px; }
}
@media (max-width: 860px) {
  .app-topbar { padding:0 13px; gap:10px; }
  .top-brand span { display:none; }
  .top-brand img { width:36px; height:36px; }
  .nav-btn { padding:0 11px; }
  .nav-btn .nav-label { display:none; }
  .top-search-wrap { display:none; }
  .user-name { display:none; }
  .page { padding:18px 12px 24px; }
  .page-head h1 { font-size:26px; }
  .page-head p { font-size:14px; }
  .current-date { display:none; }
  .list-toolbar { flex-wrap:wrap; }
  .list-title { width:100%; }
  .list-search-wrap { flex:1; width:auto; min-width:180px; }
  .two-col { grid-template-columns:1fr; }
  .reminder-summary { grid-template-columns:1fr; }
  .form-grid { grid-template-columns:1fr; }
  .span-2 { grid-column:span 1; }
  .activity-row { grid-template-columns:1fr; }
}
@media (max-width: 560px) {
  .app-topbar { height:58px; }
  .nav-btn { padding:0 8px; }
  .avatar { width:32px; height:32px; }
  .page-head { margin-bottom:15px; }
  .page-head h1 { font-size:24px; }
  .list-toolbar .btn .desktop-label { display:none; }
  .detail-actions { flex-wrap:wrap; }
  .detail-actions .btn:first-child { width:100%; flex-basis:100%; }
}
/* Connexion : une seule colonne dès que l'écran est trop étroit pour deux (tablette, téléphone) */
@media (max-width: 900px) {
  .auth-page { grid-template-columns:1fr; }
  .auth-visual { min-height:auto; padding:20px; gap:18px; }
  .auth-brand { font-size:19px; }
  .auth-brand img { width:36px; height:36px; }
  .auth-copy { padding:0; max-width:none; }
  .auth-copy h1 { font-size:26px; margin-bottom:8px; }
  .auth-copy p { font-size:14px; line-height:1.45; }
  .auth-palette { max-width:100%; }
  .auth-card-wrap { padding:28px 18px; }
  .auth-card h2 { font-size:24px; }
}


/* Thème personnalisable */
.app-topbar { background: var(--topbar-bg) !important; color: var(--topbar-text) !important; }
.nav-btn, .user-button { color: var(--topbar-text) !important; }
.btn-dark { background: var(--button-bg) !important; color: var(--button-text) !important; border-color: var(--button-bg) !important; }
.panel, .mini-card, .detail-panel, .modal, .user-popover, .filter-popover { background: var(--card) !important; color: var(--text); }
.kpi-card.total { background: var(--kpi-bg) !important; color: var(--text) !important; }
.prospect-table td, .prospect-table th, .list-toolbar, .detail-head, .modal-head { border-color: var(--line) !important; }
.theme-modal { width:min(720px,100%); }
.theme-section { border-top:1px solid var(--line); padding-top:16px; margin-top:16px; }
.theme-section:first-of-type { border-top:0; padding-top:0; margin-top:0; }
.theme-section h3 { margin:0 0 12px; font-size:15px; }
.theme-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 14px; }
.theme-control { display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.theme-control span { font-size:13px; color:var(--text); }
.theme-control input[type="color"] { width:48px; height:32px; border:1px solid var(--line-dark); border-radius:7px; padding:2px; background:var(--card); }
.theme-status-grid { display:grid; gap:8px; }
.theme-icon-btn { width:42px; height:42px; border-radius:10px; padding:0; justify-content:center; }

/* Agenda */
.calendar-shell { display:grid; gap:14px; }
.calendar-toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.calendar-toolbar h2 { margin:0 auto 0 0; font-size:22px; }
.calendar-actions { display:flex; gap:6px; flex-wrap:wrap; }
.calendar-summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.calendar-summary .mini-card strong { font-size:26px; }
.calendar-panel { padding:14px; overflow:hidden; }
.calendar-weekdays { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin-bottom:6px; }
.calendar-weekdays div { color:var(--muted); font-size:11px; font-weight:750; text-transform:uppercase; padding:0 5px; }
.calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
.calendar-day { min-height:116px; border:1px solid var(--line); border-radius:9px; padding:7px; background:var(--card); min-width:0; }
.calendar-day.outside { opacity:.45; }
.calendar-day.today-day { outline:2px solid var(--focus); outline-offset:-2px; }
.calendar-day-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:12px; font-weight:750; }
.calendar-events { display:grid; gap:5px; }
.calendar-event { width:100%; border:0; border-radius:7px; padding:6px 7px; text-align:left; font-size:11px; line-height:1.25; overflow:hidden; cursor:pointer; }
.calendar-event strong { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.calendar-event span { display:block; opacity:.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.event-relance { background:#f3e5f5; color:#4a235a; }
.event-meeting { background:#e6f1fb; color:#0c447c; }
.event-contract { background:#faeeda; color:#633806; }
.calendar-more { font-size:11px; color:var(--muted); padding:2px 4px; }
.calendar-legend { display:flex; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:12px; }
.calendar-legend span::before { content:""; display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
.calendar-legend .leg-relance::before { background:#d8bce3; }
.calendar-legend .leg-meeting::before { background:#b7d6f3; }
.calendar-legend .leg-contract::before { background:#efd39d; }
.calendar-week-list { display:grid; gap:8px; }
.calendar-week-row { display:grid; grid-template-columns:110px 1fr; gap:12px; align-items:start; border-top:1px solid var(--line); padding-top:10px; }
.calendar-week-row:first-child { border-top:0; padding-top:0; }
.calendar-week-date { font-weight:750; font-size:13px; }
.calendar-week-events { display:grid; gap:6px; }
.calendar-week-event { display:flex; align-items:center; gap:10px; width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 10px; background:var(--card); text-align:left; color:var(--text); }
.calendar-week-event .event-type { font-size:11px; color:var(--muted); min-width:76px; }

@media (max-width: 760px) {
  .theme-grid { grid-template-columns:1fr; }
  .calendar-summary { grid-template-columns:1fr; }
  .calendar-weekdays { display:none; }
  .calendar-grid { display:block; }
  .calendar-day { min-height:0; margin-bottom:8px; }
  .calendar-day.outside:has(.calendar-events:empty) { display:none; }
  .calendar-week-row { grid-template-columns:1fr; gap:6px; }
}


.theme-control {
  display:grid;
  grid-template-columns:1fr auto minmax(110px, 150px);
  align-items:center;
}
.theme-control input[type="text"],
.color-row input[type="text"] {
  width:100%;
  min-width:0;
  border:1px solid var(--line-dark);
  background:var(--card);
  color:var(--text);
  border-radius:7px;
  padding:7px 9px;
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  text-transform:uppercase;
}
.color-row {
  display:grid;
  grid-template-columns:1fr auto minmax(110px, 150px);
  align-items:center;
}


/* Barre supérieure premium */
.app-topbar {
  min-height: 76px !important;
  height: auto !important;
  background: color-mix(in srgb, var(--topbar-bg) 8%, #ffffff 92%) !important;
  color: var(--text) !important;
  display: grid !important;
  grid-template-columns: auto minmax(360px, 1fr) auto !important;
  align-items: center !important;
  gap: 22px !important;
  padding: 12px 20px !important;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 78%, #ffffff 22%);
  box-shadow: 0 8px 28px rgba(38, 28, 74, .07) !important;
}
.top-brand {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: max-content;
  white-space: nowrap;
}
.top-brand img {
  width: 42px !important;
  height: 42px !important;
  object-fit: contain;
  border-radius: 10px;
  box-shadow: 0 6px 16px rgba(67, 44, 126, .18);
}
.brand-copy { display: grid; gap: 2px; line-height: 1.05; }
.brand-title { color: var(--text); font-size: 20px; font-weight: 800; letter-spacing: -.03em; }
.brand-subtitle { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .02em; }

.top-nav-wrap { display: flex; justify-content: center; min-width: 0; }
.top-nav {
  height: auto !important;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px;
  background: color-mix(in srgb, var(--card) 90%, var(--page-bg) 10%);
  border: 1px solid var(--line);
  border-radius: 17px;
  box-shadow: 0 4px 14px rgba(27, 22, 48, .045);
}
.nav-btn {
  min-height: 42px;
  color: var(--text) !important;
  padding: 0 14px !important;
  border-radius: 12px;
  font-weight: 650;
  white-space: nowrap;
}
.nav-btn:hover { background: color-mix(in srgb, var(--page-bg) 72%, #ffffff 28%) !important; }
.nav-btn.active {
  color: var(--focus) !important;
  background: color-mix(in srgb, var(--focus) 12%, #ffffff 88%) !important;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--focus) 20%, transparent);
}
.nav-btn.active::after { display: none !important; }

.top-tools {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}
.top-search-wrap {
  width: min(29vw, 390px) !important;
  min-width: 250px;
  background: var(--card) !important;
  border: 1px solid var(--line) !important;
  border-radius: 14px !important;
  box-shadow: 0 4px 14px rgba(27, 22, 48, .035);
}
.top-search { background: transparent !important; }

.theme-icon-btn {
  width: 42px !important;
  min-width: 42px;
  height: 42px !important;
  padding: 0 !important;
  border-radius: 12px !important;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--card) !important;
  color: var(--text) !important;
  border: 1px solid var(--line) !important;
  box-shadow: 0 4px 14px rgba(27, 22, 48, .035);
}
.quick-add-btn {
  width: 42px;
  min-width: 42px;
  height: 42px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--focus);
  color: #fff;
  font-size: 25px;
  line-height: 1;
  box-shadow: 0 8px 18px color-mix(in srgb, var(--focus) 28%, transparent);
}
.quick-add-btn:hover { transform: translateY(-1px); }

.user-button {
  background: var(--card) !important;
  color: var(--text) !important;
  border: 1px solid var(--line) !important;
  border-radius: 14px !important;
  padding: 5px 8px 5px 5px !important;
  box-shadow: 0 4px 14px rgba(27, 22, 48, .035);
}

@media (max-width: 1120px) {
  .app-topbar { grid-template-columns: auto 1fr auto !important; gap: 12px !important; }
  .brand-subtitle { display: none; }
  .top-search-wrap { width: 210px !important; min-width: 180px; }
  .nav-btn { padding: 0 10px !important; }
}
@media (max-width: 860px) {
  .app-topbar { min-height: 66px !important; padding: 9px 10px !important; gap: 8px !important; }
  .brand-copy { display: none; }
  .top-brand img { width: 38px !important; height: 38px !important; }
  .nav-btn .nav-label { display: none; }
  .nav-btn { padding: 0 10px !important; }
  .top-search-wrap { display: none !important; }
  .user-name { display: none; }
}


/* Top bar refinement: compact search + avatar-only account */
.app-topbar {
  grid-template-columns: minmax(205px, auto) minmax(420px, 1fr) auto !important;
  gap: 26px !important;
}
.top-brand { padding-right: 4px; }
.top-nav-wrap { min-width: 0; }
.top-tools { gap: 10px !important; position: relative; }

.top-icon-btn {
  width: 42px;
  min-width: 42px;
  height: 42px;
  padding: 0;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(27,22,48,.035);
}
.top-icon-btn:hover,
.top-icon-btn.active {
  background: color-mix(in srgb, var(--focus) 9%, #ffffff 91%);
  color: var(--focus);
}
.top-icon-btn .icon { width: 19px; height: 19px; }

.search-popover-wrap { position: relative; }
.search-popover {
  position: absolute;
  right: 0;
  top: calc(100% + 10px);
  width: min(390px, calc(100vw - 32px));
  z-index: 50;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 9px;
  padding: 9px 10px 9px 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  box-shadow: 0 16px 42px rgba(30, 22, 61, .15);
}
.search-popover > .icon { color: var(--muted); }
.top-search-expanded {
  width: 100%;
  min-width: 0;
  border: 0 !important;
  outline: 0 !important;
  padding: 7px 2px !important;
  background: transparent !important;
  color: var(--text);
  box-shadow: none !important;
}
.search-clear-btn {
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 20px;
  line-height: 1;
}
.search-clear-btn:hover { background: var(--page-bg); color: var(--text); }

.avatar-only-button {
  min-width: 58px;
  height: 42px;
  padding: 4px 8px 4px 4px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  color: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  box-shadow: 0 4px 14px rgba(27,22,48,.035);
}
.avatar-only-button .avatar {
  width: 34px;
  height: 34px;
}
.avatar-only-button .icon {
  width: 14px;
  height: 14px;
  color: var(--muted);
}
.avatar-only-button:hover {
  background: color-mix(in srgb, var(--page-bg) 70%, #ffffff 30%);
}

@media (max-width: 1120px) {
  .app-topbar {
    grid-template-columns: auto minmax(300px, 1fr) auto !important;
    gap: 12px !important;
  }
}
@media (max-width: 860px) {
  .app-topbar {
    grid-template-columns: auto 1fr auto !important;
  }
  .avatar-only-button {
    min-width: 42px;
    width: 42px;
    padding: 3px;
  }
  .avatar-only-button > .icon { display: none; }
  .search-popover {
    position: fixed;
    left: 12px;
    right: 12px;
    top: 76px;
    width: auto;
  }
}

const STATUS_META = JSON.parse(JSON.stringify(DEFAULT_STATUS_META))

function readableTextColor(hex) {
  const clean = String(hex || '').replace('#', '')
  if (!/^[0-9a-fA-F]{6}$/.test(clean)) return '#222222'
  const r = parseInt(clean.slice(0, 2), 16)
  const g = parseInt(clean.slice(2, 4), 16)
  const b = parseInt(clean.slice(4, 6), 16)
  return (0.299 * r + 0.587 * g + 0.114 * b) > 165 ? '#222222' : '#ffffff'
}

function normalizeHex(value) {
  let v = String(value || '').trim().toUpperCase()
  if (!v.startsWith('#')) v = '#' + v
  if (/^#[0-9A-F]{3}$/.test(v)) {
    v = '#' + v.slice(1).split('').map(ch => ch + ch).join('')
  }
  return /^#[0-9A-F]{6}$/.test(v) ? v : null
}

function loadStatusColors() {
  try {
    const saved = JSON.parse(localStorage.getItem('dovozo-status-colors') || '{}')
    for (const status of STATUSES) {
      if (saved[status]) {
        STATUS_META[status].bg = saved[status]
        STATUS_META[status].text = readableTextColor(saved[status])
      }
    }
  } catch {}
}

function saveStatusColors() {
  const saved = Object.fromEntries(STATUSES.map(status => [status, STATUS_META[status].bg]))
  localStorage.setItem('dovozo-status-colors', JSON.stringify(saved))
  if (state?.backend === 'supabase' && can('settings')) void saveSharedSettings().catch(error => { console.error(error); toast('Synchronisation des couleurs impossible.', true) })
}

function resetStatusColors() {
  for (const status of STATUSES) {
    STATUS_META[status] = { ...DEFAULT_STATUS_META[status] }

}

function countByStatus(prospects) {
  const counts = Object.fromEntries(STATUSES.map(status => [status, 0]))
  for (const prospect of prospects) {
    if (prospect?.status in counts) counts[prospect.status] += 1
  }
  return counts
}

function filterProspects(prospects, query = '', status = 'Tous') {
 const fold=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('fr-FR');
 const q=fold(query.trim());
 return prospects.filter(p=>{
  if(status!=='Tous'&&p.status!==status)return false;
  const h=historyItems(p.id).map(x=>`${x.title} ${x.text}`).join(' ');
  const text=fold([p.company,p.contact_name,p.email,p.phone,p.notes,p.competitor,p.status,statusLabel(p.status),priorityValue(p.priority),h].filter(Boolean).join(' '));
  return !q||text.includes(q);
 });
}

function nextReminderDate(prospect) {
  return prospect.reminder_date || prospect.followup_date || null
}

function getDueReminders(prospects, today) {
  return prospects
    .filter(prospect => !['Gagné', 'Perdu'].includes(prospect.status))
    .filter(prospect => {
      const date = nextReminderDate(prospect)
      return Boolean(date && date <= today)
    })
    .slice()
    .sort((a, b) => String(nextReminderDate(a)).localeCompare(String(nextReminderDate(b))))
}

function formatDateFr(value) {
  if (!value) return '—'
  const [year, month, day] = String(value).slice(0, 10).split('-')
  if (!year || !month || !day) return '—'
  return `${day}/${month}/${year}`
}

function formatLongDateFr(date = new Date()) {
  return new Intl.DateTimeFormat('fr-FR', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
  }).format(date).replace(/^./, char => char.toUpperCase())
}

function sortProspects(prospects,key,direction='asc') {
 const sign=direction==='desc'?-1:1, rank={Faible:0,Normale:1,Haute:2};
 return prospects.slice().sort((a,b)=>{
  if(key==='priority')return (rank[priorityValue(a.priority)]-rank[priorityValue(b.priority)])*sign;
  const av=key==='reminder_date'?nextReminderDate(a):key==='status'?statusLabel(a.status):a[key];
  const bv=key==='reminder_date'?nextReminderDate(b):key==='status'?statusLabel(b.status):b[key];
  if(!av&&bv)return 1;if(av&&!bv)return -1;
  return String(av??'').localeCompare(String(bv??''),'fr',{sensitivity:'base',numeric:true})*sign;
 });
}

function initials(value = '') {
  const parts = String(value).trim().split(/\s+/).filter(Boolean)
  if (!parts.length) return '?'
  return parts.slice(0, 2).map(part => part[0]?.toUpperCase() || '').join('')
}

function todayIso(date = new Date()) {
  const year = date.getFullYear()
  const month = String(date.getMonth() + 1).padStart(2, '0')
  const day = String(date.getDate()).padStart(2, '0')
  return `${year}-${month}-${day}`
}

function makeId(cryptoLike = globalThis.crypto) {
  if (cryptoLike && typeof cryptoLike.randomUUID === 'function') return cryptoLike.randomUUID()
  const rand = Math.random().toString(36).slice(2, 10)
  return `local-${Date.now().toString(36)}-${rand}`
}

  const url = String(config?.supabaseUrl || '')

  if (!url.startsWith('https://') || !key || key.startsWith('sb_secret_')) return false
  if (key.split('.').length === 3) {

      const payload = JSON.parse(atob(key.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))

}

function esc(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;')
}

function attr(value) { return esc(value) }
function selected(a, b) { return a === b ? ' selected' : '' }
function checked(v) { return v ? ' checked' : '' }

function statusStyle(status) {
  const meta = STATUS_META[status] || { bg: '#f0f1f3', text: '#414854' }
  return `background:${meta.bg};color:${meta.text};border-color:${meta.bg}`
}

function statusOptions(current) {
  return STATUSES.map(status => `<option value="${attr(status)}"${selected(status, current)}>${esc(statusLabel(status))}</option>`).join('')
}

function profileOptions(current) {
  const options = ['<option value="">Non attribué</option>']
  for (const profile of state.profiles) {
    options.push(`<option value="${attr(profile.id)}"${selected(profile.id, current || '')}>${esc(profile.full_name || profile.email || 'Utilisateur')}</option>`)
  }
  return options.join('')
}

function getSelected() {
  return state.prospects.find(p => p.id === state.selectedId) || null
}

function userDisplayName() {
  if (state.backend === 'demo') return ''
  const id = state.session?.user?.id
  const profile = state.profiles.find(p => p.id === id)
  const raw = profile?.full_name || state.session?.user?.user_metadata?.full_name || state.session?.user?.email?.split('@')[0] || ''
  if (!raw || raw === 'demo') return ''
  return raw.charAt(0).toUpperCase() + raw.slice(1)
}

function greetingTitle() {
  const name = userDisplayName()
  return name ? `Bonjour ${esc(name)} !` : 'Bonjour !'
}

function toast(message, error = false) {
  let zone = document.querySelector('.toast-zone')
  if (!zone) {
    zone = document.createElement('div')
    zone.className = 'toast-zone'
    document.body.appendChild(zone)
  }
  const item = document.createElement('div')
  item.className = `toast${error ? ' error' : ''}`
  item.textContent = message
  zone.appendChild(item)
  setTimeout(() => item.remove(), 3200)
}

  const { data, error } = await state.supabase.from('memberships')
    .select('id,organization_id,user_id,role,state,display_name,email,created_at')
    .eq('user_id', state.session.user.id).maybeSingle()
  if (error) throw error
  if (!data || data.state !== 'active') { state.accessReason = 'Votre accès à Dovozo clients est en attente ou désactivé.'; return false }
  state.membership = data
  const members = await state.supabase.from('memberships').select('id,organization_id,user_id,role,state,display_name,email,created_at')
    .eq('organization_id', data.organization_id).order('display_name')
  if (members.error) throw members.error
  state.members = members.data || []
  state.profiles = state.members.filter(x => x.state === 'active').map(x => ({ id:x.user_id, full_name:x.display_name, role:x.role }))
  return true
}
async function initSupabase() {
  try {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/+esm')
    state.supabase = createClient(CONFIG.supabaseUrl, CONFIG.supabasePublishableKey)
    const { data, error } = await state.supabase.auth.getSession()
    if (error) throw error
    state.session = data.session
    state.supabase.auth.onAuthStateChange(async (_event, session) => {
      if (_event === 'PASSWORD_RECOVERY') state.authSetup = true
      state.session = session; state.authMessage = ''; clearRealtime()
      if (session && !state.authSetup && await loadMembership()) await loadRemote()
      render()
    })
    if (state.session && !state.authSetup && await loadMembership()) await loadRemote()
    state.loading = false
  } catch (error) {
    console.error(error)
    state.accessReason = 'Connexion sécurisée momentanément indisponible.'
    state.loading = false
  }
}
function clearRealtime() {
  if (state.supabase) for (const channel of state.realtimeChannels) state.supabase.removeChannel(channel)
  state.realtimeChannels = []; state.realtimeChannel = null
}
function subscribeToOrganization() {
  clearRealtime()
  const org = state.membership?.organization_id
  if (!org) return
  for (const table of ['prospects','activities','status_history','organization_settings','memberships']) {
    const channel = state.supabase.channel(`dovozo-${org}-${table}`)
    const handleChange = async payload => {
        const payloadOrg = payload?.new?.organization_id || payload?.old?.organization_id
        if (payloadOrg && payloadOrg !== org) return
        try {
          if (table === 'memberships') {
            const active = await loadMembership()
            if (!active) { clearRealtime(); state.prospects = []; render(); return }
          }
          await loadRemote(false); if (!userIsEditing()) render()
        } catch (error) { console.error(error) }
      }
    channel.on('postgres_changes', { event:'INSERT', schema:'public', table, filter:`organization_id=eq.${org}` }, handleChange)
      .on('postgres_changes', { event:'UPDATE', schema:'public', table, filter:`organization_id=eq.${org}` }, handleChange).subscribe()
    state.realtimeChannels.push(channel)
  }
  state.realtimeChannel = state.realtimeChannels[0] || null
}
async function loadRemote(resubscribe = true) {
  if (!state.supabase || !state.session || !state.membership) return
  const org = state.membership.organization_id
  const [result, settings] = await Promise.all([
    state.supabase.from('prospects').select('*').eq('organization_id', org)
      .order('source_order', { ascending: true, nullsFirst: false }).order('updated_at', { ascending: false }),
    state.supabase.from('organization_settings').select('status_labels,status_colors,pipeline').eq('organization_id', org).maybeSingle(),
  ])
  if (result.error) throw result.error
  if (settings.error) throw settings.error
  state.prospects = result.data || []
  if (settings.data) applySharedSettings(settings.data)
  if (!state.selectedId || !state.prospects.some(p => p.id === state.selectedId)) state.selectedId = state.prospects[0]?.id || null
  if (resubscribe && !state.realtimeChannels.length) subscribeToOrganization()
}
function userIsEditing() {
  const active = document.activeElement
  return Boolean(state.editor) || Boolean(active && active.closest && active.closest('input, textarea, select, [contenteditable="true"]'))
}

async function refreshConnectedAccess() {
  if (state.backend !== 'supabase' || !state.session || document.hidden) return
  if (userIsEditing()) return // ne jamais redessiner pendant une saisie : render() remplace tout le DOM
  try {
    const active = await loadMembership()
    if (!active) { clearRealtime(); state.prospects = []; render(); return }
    await loadRemote(false); render()
  } catch (error) {
    console.error(error)
    clearRealtime(); state.membership = null; state.prospects = []; state.accessReason = 'Votre accès doit être vérifié à nouveau.'; render()
  }
}

function applySharedSettings(settings) {
  if (settings.status_labels && typeof settings.status_labels === 'object') {
    const labels = {}
    for (const status of STATUSES) if (typeof settings.status_labels[status] === 'string' && settings.status_labels[status].trim()) labels[status] = settings.status_labels[status].trim().slice(0, 40)
    STATUS_LABELS = labels
    localStorage.setItem('dovozo-status-labels', JSON.stringify(labels))
  }
  if (settings.status_colors && typeof settings.status_colors === 'object') {
    for (const status of STATUSES) {
      const color = normalizeHex(settings.status_colors[status])
      if (color) STATUS_META[status] = { bg: color, text: readableTextColor(color) }
    }
    localStorage.setItem('dovozo-status-colors', JSON.stringify(Object.fromEntries(STATUSES.map(status => [status, STATUS_META[status].bg]))))
  }
  if (settings.pipeline && typeof settings.pipeline === 'object') {
    PIPELINE_PREFS = normalizePipeline(settings.pipeline)
    localStorage.setItem('dovozo-pipeline', JSON.stringify(PIPELINE_PREFS))
  }
}

async function saveSharedSettings() {

    pipeline: PIPELINE_PREFS,
  }

async function updateProspect(id, payload, { silent = false } = {}) {
  if (state.backend === 'demo') {
    const index = state.prospects.findIndex(p => p.id === id)
    if (index < 0) return
    const previous = state.prospects[index]
    const next = { ...previous, ...payload, updated_at: new Date().toISOString() }
    state.prospects[index] = next
    if (payload.status && payload.status !== previous.status) {
      state.demoHistory.unshift({
        id: makeId(), prospect_id: id, user_id: 'demo-user',
        from_status: previous.status, to_status: payload.status, changed_at: new Date().toISOString(),
      })
    }
    persistDemo()
  } else {
    const { error } = await state.supabase.from('prospects').update(remotePayload(payload)).eq('id', id)
    if (error) throw error
    await loadRemote()
  }
  if (!silent) toast('Prospect mis à jour.')
}

async function createProspect(payload) {
  if (state.backend === 'demo') {
    const row = {
      id: makeId(), source_order: Math.max(0, ...state.prospects.map(p => Number(p.source_order) || 0)) + 1, ...payload,
      status: payload.status || 'Identifié', priority: payload.priority || 'Normale',
      created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
    }
    state.prospects.unshift(row)
    state.selectedId = row.id
    state.demoHistory.unshift({ id: makeId(), prospect_id: row.id, user_id: 'demo-user', from_status: null, to_status: row.status, changed_at: new Date().toISOString() })
    persistDemo()
  } else {
    const source_order = Math.max(0, ...state.prospects.map(p => Number(p.source_order) || 0)) + 1
    const { data, error } = await state.supabase.from('prospects').insert(remotePayload({ ...payload, source_order })).select('*').single()
    if (error) throw error
    state.selectedId = data.id
    await loadRemote()
  }
  toast('Prospect ajouté.')
}

async function deleteProspect(id) {
  const prospect = state.prospects.find(p => p.id === id)
  if (!prospect) return
  requirePermission('delete')
  if (!confirm(`Supprimer ${prospect.company} ?`)) return
  if (state.backend === 'demo') {
    state.prospects = state.prospects.filter(p => p.id !== id)
    state.demoActivities = state.demoActivities.filter(x => x.prospect_id !== id)
    state.demoHistory = state.demoHistory.filter(x => x.prospect_id !== id)
    persistDemo()
  } else {
    const { error } = await state.supabase.from('prospects').delete().eq('id', id)
    if (error) throw error
    await loadRemote()
  }
  state.selectedId = state.prospects[0]?.id || null
  state.editor = null
  toast('Prospect supprimé.')
  render()
}

async function addActivity(prospectId, activityType, note) {
  if (!note.trim()) return
  if (state.backend === 'demo') {
    state.demoActivities.unshift({ id: makeId(), prospect_id: prospectId, user_id: 'demo-user', activity_type: activityType, note: note.trim(), happened_at: new Date().toISOString() })
  } else {
    const { error } = await state.supabase.from('activities').insert({ prospect_id: prospectId, activity_type: activityType, note: note.trim() })
    if (error) throw error
  }
  persistDemo()
  await loadTimeline(prospectId)
  toast('Action ajoutée à l’historique.')
}

async function loadTimeline(prospectId) {
  if (!prospectId) { state.timeline = []; return }
  let activities = []
  let history = []
  if (state.backend === 'demo') {
    activities = state.demoActivities.filter(x => x.prospect_id === prospectId)
    history = state.demoHistory.filter(x => x.prospect_id === prospectId)
  } else {
    const [a, h] = await Promise.all([
      state.supabase.from('activities').select('*').eq('prospect_id', prospectId).order('happened_at', { ascending: false }),
      state.supabase.from('status_history').select('*').eq('prospect_id', prospectId).order('changed_at', { ascending: false }),
    ])
    activities = a.data || []
    history = h.data || []
  }
  state.timeline = [
    ...activities.map(x => ({ id: `a-${x.id}`, at: x.happened_at, text: `${x.activity_type}${x.note ? ` — ${x.note}` : ''}` })),
    ...history.map(x => ({ id: `h-${x.id}`, at: x.changed_at, text: `Statut : ${statusLabel(x.from_status || 'création')} → ${statusLabel(x.to_status)}` })),
  ].sort((a, b) => new Date(b.at) - new Date(a.at))
}

function authErrorMessage(error) {
  const raw = String(error?.message || '')
  const text = raw.toLowerCase()
  if (text.includes('invalid login credentials')) return 'Email ou mot de passe incorrect.'
  if (text.includes('email not confirmed')) return 'Votre adresse email n’a pas encore été confirmée : ouvrez le lien reçu par email.'
  if (text.includes('rate limit') || text.includes('too many')) return 'Trop de tentatives : patientez quelques minutes avant de réessayer.'
  if (text.includes('failed to fetch') || text.includes('network')) return 'Connexion impossible : vérifiez votre accès internet.'
  return raw || 'Connexion impossible.'
}

function parseDateOnly(value) {
  const m = String(value || '').slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/)
  if (!m) return null
  return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]))
}

function isoLocal(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`
}

function calendarEvents() {
  const events = []
  for (const p of state.prospects) {
    const reminder = p.reminder_date || p.followup_date
    if (reminder && activeProspect(p)) events.push({ date: String(reminder).slice(0,10), type:'relance', label:'Relance', prospect:p })
    if (p.next_meeting && activeProspect(p)) events.push({ date: String(p.next_meeting).slice(0,10), type:'meeting', label:'Rendez-vous', prospect:p })
    if (p.contract_end) events.push({ date: String(p.contract_end).slice(0,10), type:'contract', label:'Fin contrat', prospect:p })
  }
  return events.sort((a,b) => a.date.localeCompare(b.date) || a.prospect.company.localeCompare(b.prospect.company,'fr'))
}

function weekBounds(date) {
  const d = new Date(date)
  const day = (d.getDay() + 6) % 7
  const start = new Date(d)
  start.setDate(d.getDate() - day)
  start.setHours(0,0,0,0)
  const end = new Date(start)
  end.setDate(start.getDate() + 6)
  end.setHours(23,59,59,999)
  return [start,end]
}

function renderCalendarEvent(event) {
  return `<button type="button" class="calendar-event event-${event.type}" data-action="calendar-open-prospect" data-id="${attr(event.prospect.id)}">
    <strong>${esc(event.prospect.company)}</strong>
    <span>${esc(event.label)}</span>
  </button>`
}

function renderAgenda() {
  const events = calendarEvents()
  const today = todayIso()
  const todayDate = parseDateOnly(today)
  const [weekStart, weekEnd] = weekBounds(todayDate)
  const weekStartIso = isoLocal(weekStart)
  const weekEndIso = isoLocal(weekEnd)
  const todayCount = events.filter(e => e.date === today).length
  const weekCount = events.filter(e => e.date >= weekStartIso && e.date <= weekEndIso).length
  const overdue = events.filter(e => e.type === 'relance' && e.date < today && !['Gagné','Perdu'].includes(e.prospect.status)).length

  const anchor = parseDateOnly(state.calendarAnchor) || todayDate
  const titleFormatter = new Intl.DateTimeFormat('fr-FR', { month:'long', year:'numeric' })
  const weekFormatter = new Intl.DateTimeFormat('fr-FR', { day:'numeric', month:'short' })

  let body = ''
  let heading = ''

  if (state.calendarMode === 'month') {
    const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1)
    const start = new Date(first)
    start.setDate(first.getDate() - ((first.getDay()+6)%7))
    heading = titleFormatter.format(first).replace(/^./, c => c.toUpperCase())
    const days = []
    for (let i=0;i<42;i++) {
      const d = new Date(start)
      d.setDate(start.getDate()+i)
      const iso = isoLocal(d)
      const dayEvents = events.filter(e => e.date === iso)
      const outside = d.getMonth() !== anchor.getMonth()
      days.push(`<div class="calendar-day${outside ? ' outside' : ''}${iso === today ? ' today-day' : ''}">
        <div class="calendar-day-head"><span>${d.getDate()}</span>${dayEvents.length ? `<span>${dayEvents.length}</span>` : ''}</div>
        <div class="calendar-events">${dayEvents.slice(0,4).map(renderCalendarEvent).join('')}${dayEvents.length > 4 ? `<div class="calendar-more">+ ${dayEvents.length-4} autre(s)</div>` : ''}</div>
      </div>`)
    }
    body = `<div class="calendar-weekdays">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<div>${d}</div>`).join('')}</div><div class="calendar-grid">${days.join('')}</div>`
  } else {
    const [start,end] = weekBounds(anchor)
    heading = `${weekFormatter.format(start)} — ${weekFormatter.format(end)}`
    const rows = []
    for (let i=0;i<7;i++) {
      const d = new Date(start)
      d.setDate(start.getDate()+i)
      const iso = isoLocal(d)
      const dayEvents = events.filter(e => e.date === iso)
      const label = new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'short'}).format(d)
      rows.push(`<div class="calendar-week-row">
        <div class="calendar-week-date">${esc(label.replace(/^./,c=>c.toUpperCase()))}</div>
        <div class="calendar-week-events">${dayEvents.length ? dayEvents.map(e => `<button type="button" class="calendar-week-event" data-action="calendar-open-prospect" data-id="${attr(e.prospect.id)}"><span class="event-type">${esc(e.label)}</span><strong>${esc(e.prospect.company)}</strong><span style="color:var(--muted)">${esc(e.prospect.contact_name || '')}</span></button>`).join('') : '<span style="color:var(--muted)">Aucune action prévue</span>'}</div>
      </div>`)
    }
    body = `<div class="calendar-week-list">${rows.join('')}</div>`
  }

  return `<div class="calendar-shell">
    <section class="calendar-summary">
      <div class="mini-card"><span>Aujourd’hui</span><strong>${todayCount}</strong></div>
      <div class="mini-card"><span>Cette semaine</span><strong>${weekCount}</strong></div>
      <div class="mini-card"><span>Relances en retard</span><strong class="overdue">${overdue}</strong></div>
    </section>
    <section class="panel calendar-panel">
      <div class="calendar-toolbar">
        <h2>${esc(heading)}</h2>
        <div class="calendar-actions">
          <button class="btn" type="button" data-action="calendar-prev">←</button>
          <button class="btn" type="button" data-action="calendar-today">Aujourd’hui</button>
          <button class="btn" type="button" data-action="calendar-next">→</button>
          <button class="btn${state.calendarMode === 'month' ? ' btn-dark' : ''}" type="button" data-action="calendar-mode" data-mode="month">Mois</button>
          <button class="btn${state.calendarMode === 'week' ? ' btn-dark' : ''}" type="button" data-action="calendar-mode" data-mode="week">Semaine</button>
        </div>
      </div>
      <div class="calendar-legend" style="margin:10px 0 14px"><span class="leg-relance">Relance</span><span class="leg-meeting">Rendez-vous / call</span><span class="leg-contract">Fin de contrat</span></div>
      ${body}
    </section>
  </div>`
}

function nullable(value) {
  const clean = String(value ?? '').trim()
  return clean ? clean : null
}

const REMOTE_TEXT_COLUMNS = ['contact_name', 'email', 'phone', 'notes', 'competitor']
function remotePayload(payload) {
  const clean = { ...payload }
  for (const key of REMOTE_TEXT_COLUMNS) if (key in clean && clean[key] == null) clean[key] = ''
  return clean
}

    } else if (action === 'close-detail') {

      state.detailOpen = false
      render()

      render()

        state.sortKey = key
        state.sortDirection = 'asc'
      }
      render()

    } else if (action === 'add-prospect') {
      state.editor = { id: null }
      state.timeline = []
      render()

    } else if (action === 'edit-prospect') {
      event.stopPropagation()
      state.editor = { id: actionNode.dataset.id }
      await loadTimeline(actionNode.dataset.id)
      render()

    } else if (action === 'close-editor') {
      state.editor = null
      state.timeline = []
      render()

    } else if (action === 'modal-backdrop' && event.target === actionNode) {
      state.editor = null
      state.timeline = []
      render()

    } else if (action === 'delete-prospect') {
      await deleteProspect(actionNode.dataset.id)

    } else if (action === 'plan-reminder') {
      const input = document.querySelector('#quick-reminder-date')

      if (!input?.value) {
        toast('Choisissez d’abord une date de relance.')
        input?.focus()
        input?.showPicker?.()
      } else if (prospect) {
        const url = googleCalendarUrl(prospect, input.value)
        if (url) window.open(url, '_blank', 'noopener')
      }

    } else if (action === 'kpi-filter') {
      clearFilters()
      state.statusFilter = actionNode.dataset.status || 'Tous'
      state.view = 'dashboard'
      state.selectedId = null
      render()
      requestAnimationFrame(() => {
        document.querySelector('.list-panel')?.scrollIntoView({
          behavior: 'smooth',
          block: 'start',
        })
      })

    } else if (action === 'open-colors') {
      state.colorSettingsOpen = true
      render()

    } else if (action === 'close-colors') {
      state.colorSettingsOpen = false
      render()

    } else if (action === 'close-colors-backdrop' && event.target === actionNode) {
      state.colorSettingsOpen = false
      render()

    } else if (action === 'reset-theme') {
      resetTheme()
      render()
      toast('Thème réinitialisé.')

    } else if (action === 'calendar-open-prospect') {
      state.selectedId = actionNode.dataset.id
      state.detailOpen = true
      await loadTimeline(state.selectedId)
      state.view = 'dashboard'
      render()

    } else if (action === 'calendar-mode') {
      state.calendarMode = actionNode.dataset.mode === 'week' ? 'week' : 'month'
      render()

    } else if (action === 'calendar-today') {
      state.calendarAnchor = todayIso()
      render()

    } else if (action === 'calendar-prev' || action === 'calendar-next') {
      const d = parseDateOnly(state.calendarAnchor) || new Date()
      const delta = action === 'calendar-prev' ? -1 : 1

      if (state.calendarMode === 'month') {
        d.setMonth(d.getMonth() + delta)
      } else {
        d.setDate(d.getDate() + 7 * delta)
      }

      state.calendarAnchor = isoLocal(d)
      render()

    } else if (action === 'toggle-search') {
      state.searchExpanded = !state.searchExpanded
      render()
      if (state.searchExpanded) {
        requestAnimationFrame(() => document.querySelector('.top-search-expanded')?.focus())
      }
    } else if (action === 'clear-search') {
      state.query = ''
      state.searchExpanded = true
      render()
      requestAnimationFrame(() => document.querySelector('.top-search-expanded')?.focus())
    } else if (action === 'toggle-user') {
      state.userMenuOpen = !state.userMenuOpen
      render()

    } else if (action === 'logout') {
      await state.supabase.auth.signOut()

    } else if (action === 'reset-demo') {
      localStorage.removeItem('crm-prospection-demo-v2')

      state.userMenuOpen = false
      await loadDemo()
      render()
      toast('Données réinitialisées.')

    } else if (action === 'toggle-auth') {
      state.authMode = state.authMode === 'login' ? 'signup' : 'login'
      state.authMessage = ''
      render()
    }
  } catch (error) {
    console.error(error)
    toast(error.message || 'Une erreur est survenue.', true)
  }
})

app.addEventListener('input', event => {
  const themeHex = event.target.closest?.('[data-theme-hex]')
  if (themeHex) {
    const key = themeHex.dataset.themeHex
    const hex = normalizeHex(themeHex.value)
    themeHex.setCustomValidity(hex ? '' : 'Utilisez un code comme #C8A2C8')
    if (hex && key in APP_THEME) {
      APP_THEME[key] = hex
      saveTheme()
      applyTheme()
      const picker = themeHex.closest('.theme-control')?.querySelector('[data-theme-color]')
      if (picker) picker.value = hex
    }
    return
  }

  const themeInput = event.target.closest?.('[data-theme-color]')
  if (themeInput) {
    const key = themeInput.dataset.themeColor
    if (key in APP_THEME) {
      APP_THEME[key] = themeInput.value.toUpperCase()
      saveTheme()
      applyTheme()
      const hexInput = themeInput.closest('.theme-control')?.querySelector('[data-theme-hex]')
      if (hexInput) {
        hexInput.value = APP_THEME[key]
        hexInput.setCustomValidity('')
      }
    }
    return
  }

  const statusHex = event.target.closest?.('[data-status-hex]')
  if (statusHex) {
    const status = statusHex.dataset.statusHex
    const hex = normalizeHex(statusHex.value)
    statusHex.setCustomValidity(hex ? '' : 'Utilisez un code comme #C8A2C8')
    if (hex && STATUS_META[status]) {
      STATUS_META[status].bg = hex
      STATUS_META[status].text = readableTextColor(hex)
      saveStatusColors()
      const row = statusHex.closest('.color-row')
      const picker = row?.querySelector('[data-status-color]')
      const chip = row?.querySelector('.status-chip')
      if (picker) picker.value = hex
      if (chip) chip.setAttribute('style', statusStyle(status))
    }
    return
  }

  const input = event.target.closest?.('[data-status-color]')
  if (!input) return
  const status = input.dataset.statusColor
  if (!STATUS_META[status]) return
  const hex = input.value.toUpperCase()
  STATUS_META[status].bg = hex
  STATUS_META[status].text = readableTextColor(hex)
  saveStatusColors()
  const row = input.closest('.color-row')
  const chip = row?.querySelector('.status-chip')
  const hexInput = row?.querySelector('[data-status-hex]')
  if (chip) chip.setAttribute('style', statusStyle(status))
  if (hexInput) {
    hexInput.value = hex
    hexInput.setCustomValidity('')
  }
})

app.addEventListener('change', event => {
  const input = event.target.closest?.('[data-theme-hex], [data-status-hex]')
  if (!input) return
  const hex = normalizeHex(input.value)
  if (hex) input.value = hex
})

app.addEventListener('submit', async event => {
  const form = event.target
  const formName = form?.dataset?.form
  if (!formName) return
  event.preventDefault()
  const submitButton = form.querySelector('[type="submit"]')
  if (submitButton) submitButton.disabled = true
  try {
    const data = new FormData(form)
    if (formName === 'auth') {
      state.authMessage = ''
      const email = String(data.get('email') || '')
      const password = String(data.get('password') || '')
      const result = await state.supabase.auth.signInWithPassword({ email, password })
      if (result.error) state.authMessage = authErrorMessage(result.error)
      render()
    } else if (formName === 'password-recovery') {
      const email = String(data.get('recovery_email') || '').trim()
      const result = await state.supabase.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname })
      if (result.error) throw result.error
      toast('Un email de réinitialisation vient d’être envoyé.')
    } else if (formName === 'password-setup') {
      const password = String(data.get('password') || '')
      const confirmation = String(data.get('password_confirm') || '')
      if (password.length < 10) throw new Error('Utilisez au moins 10 caractères.')
      if (password !== confirmation) throw new Error('Les deux mots de passe sont différents.')
      const result = await state.supabase.auth.updateUser({ password })
      if (result.error) throw result.error
      state.authSetup = false
      history.replaceState(null, '', location.pathname)
      if (await loadMembership()) await loadRemote()
      render(); toast('Mot de passe enregistré.')
    } else if (formName === 'quick-save') {
      const id = form.dataset.id
      await updateProspect(id, {
        phone: nullable(data.get('phone')),
        priority: priorityValue(data.get('priority')),
        next_meeting: nullable(data.get('next_meeting')),
        owner_id: nullable(data.get('owner_id')),
        competitor: nullable(data.get('competitor')),
        contract_end: nullable(data.get('contract_end')),
        reminder_date: nullable(data.get('reminder_date')),
        notes: nullable(data.get('notes')),
        ...(data.get('reminder_date') ? {} : { followup_date: null }),
      })
      render()
    } else if (formName === 'editor') {
      const id = form.dataset.id
      const payload = prospectPayload(data)
      if (!payload.company) throw new Error('Le nom de l’entreprise est obligatoire.')
      if (id) await updateProspect(id, payload)
      else await createProspect(payload)
      state.editor = null
      state.timeline = []
      render()
    } else if (formName === 'activity') {
      await addActivity(form.dataset.id, String(data.get('activity_type') || 'Note'), String(data.get('note') || ''))
      render()
    } else if (formName === 'invite-member') {
      await inviteMember(String(data.get('invite_email') || ''), String(data.get('invite_display_name') || ''))
      render(); toast('Invitation envoyée.')
    }
  } catch (error) {
    console.error(error)
    if (formName === 'auth') { state.authMessage = error.message || 'Connexion impossible.'; render() }
    else toast(error.message || 'Une erreur est survenue.', true)
  } finally {
    if (submitButton?.isConnected) submitButton.disabled = false
  }
})
